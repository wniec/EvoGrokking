[project]
name = "evogrokking"
version = "0.1.0"
description = "Evolving neural architectures that generalise without grokking"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "neat-python>=2.0",
]

[tool.setuptools.packages.find]
include = ["evogrokking*"]
